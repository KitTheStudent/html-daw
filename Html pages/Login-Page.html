<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Landing-Page.css">
    <link rel="stylesheet" href="../css/forms.css">
    <title>Traveler's Journey - Login</title>
</head>
<body>
    <header>
        <h1>Traveler's Journey</h1>
    </header>
    <nav>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html" class="active">About</a></li>
            <li><a href="Contact.html">Contact</a></li>
            <li><a href="Create-Account.html">Sign Up</a></li>
            <li><a href="Login-Page.html">Log In</a></li>
            <li><a href="Categories.html">Categories</a></li>
            <!-- Search button added to the navigation ribbon. -->
            <li class="ribbon-search">
                <button id="open-search" type="button" aria-haspopup="dialog" aria-controls="search-dialog">
                    <span aria-hidden="true">⌕</span>
                    <span>Search</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- Search popup added; search functionality will be added later. -->
    <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
        <div class="search-dialog-heading">
            <h2 id="search-title">Search games</h2>
            <button id="close-search" class="search-close" type="button" aria-label="Close search">&times;</button>
        </div>
        <label class="visually-hidden" for="game-search">Search games</label>
        <input id="game-search" type="search" placeholder="Search games..." autocomplete="off">
    </dialog>

    <main class="form-container">
        <h2>Log In</h2>
        <p id="account-created-notice" class="form-success" role="status" aria-live="polite" hidden>
            Account created successfully. You can now log in.
        </p>
        <form action="../php/Login-Page.php" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <label class="password-toggle" for="show-password">
                <input type="checkbox" id="show-password">
                Show password
            </label>
            <input class="btn-submit" type="submit" value="Login">
        </form>
        <p class="form-footer">New traveler? <a href="Create-Account.html">Create an account</a></p>
    </main>
    <script>
        // Let the visitor check their password and show the signup success notice.
        const password = document.getElementById("password");
        document.getElementById("show-password").addEventListener("change", event => {
            password.type = event.target.checked ? "text" : "password";
        });

        if (new URLSearchParams(window.location.search).get("created") === "1") {
            document.getElementById("account-created-notice").hidden = false;
        }
    </script>
    <script src="../js/search-overlay.js"></script>
    <script src="../js/auth-status.js"></script>
</body>
</html>
