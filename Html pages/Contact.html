<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/Landing-Page.css">
    <link rel="stylesheet" href="../css/forms.css">
    <!-- Font Awesome CDN for real vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Traveler's Journey</h1>
    </header>

    <nav>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Contact.html" class="active">Contact</a></li>
            <li><a href="Create-Account.html">Sign Up</a></li>
            <li><a href="Login-Page.html">Log In</a></li>
            <li><a href="Categories.html">Categories</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2><i class="fa-solid fa-crow"></i> Send a Raven</h2>
        <p class="form-footer">Submitting opens your email app with the message ready to send.</p>
        
        <!-- Submitting this form opens a prefilled message in the visitor's email app. -->
        <form action="mailto:lardizabalkitandrew@gmail.com" method="post" enctype="text/plain">
            <input type="hidden" name="subject" value="Traveler's Journey contact message">
            
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-feather"></i> Dispatch Raven
            </button>
        </form>
    </div>
    <script src="../js/auth-status.js"></script>
</body>
</html>
